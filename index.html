<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建築物室內裝修工程管理乙級 - 學科模擬測驗</title>
  <style>
    :root {
      --primary: #2b5876;
      --secondary: #4e4376;
      --success: #28a745;
      --danger: #dc3545;
      --bg: #f4f7f6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .bank-info-box {
      background: #eef2f5;
      border-left: 5px solid var(--primary);
      padding: 15px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 15px;
      line-height: 1.6;
    }
    .bank-info-box strong { color: var(--primary); }
    .btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      margin: 20px auto;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    #timer-bar {
      position: sticky;
      top: 0;
      background: #fff;
      padding: 12px 0;
      border-bottom: 2px solid #eee;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 16px;
      z-index: 100;
    }
    .card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background: #fafafa;
    }
    .card-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 12px;
      border-radius: 4px;
      color: white;
      margin-right: 8px;
    }
    .badge-single { background-color: #007bff; }
    .badge-multi { background-color: #6f42c1; }
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-label {
      display: flex;
      align-items: center;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
    }
    .option-label:hover { background: #f0f4f8; }
    .option-label input { margin-right: 10px; }
    .result-header {
      text-align: center;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .pass { background-color: #d4edda; color: #155724; }
    .fail { background-color: #f8d7da; color: #721c24; }
    .review-card { border-left: 6px solid #ccc; }
    .review-card.correct { border-left-color: var(--success); }
    .review-card.wrong { border-left-color: var(--danger); }
    .ans-info {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
    }
    .ans-info.wrong-bg { background: #fff3f3; color: var(--danger); }
    .ans-info.correct-bg { background: #f3fff3; color: var(--success); }
  </style>
</head>
<body>

<div class="container">
  <h1>學科測試模擬考試</h1>

  <!-- 開始畫面 -->
  <div id="start-screen">
    <div class="bank-info-box" id="bank-info">
      載入題庫統計中...
    </div>

    <p style="text-align: center; line-height: 1.8;">
      <strong>考試規則：</strong><br>
      • 隨機抽取 <strong>80 題</strong>（單選 60 題 + 複選 20 題）<br>
      • 每題 1.25 分，總分 100 分，<strong>60 分及格</strong><br>
      • 測驗時間：<strong>100 分鐘</strong>
    </p>
    <button class="btn" id="start-btn" onclick="startQuiz()">開始測驗</button>
  </div>

  <!-- 測驗進行畫面 -->
  <div id="quiz-screen" style="display: none;">
    <div id="timer-bar">
      <span>⏱ 剩餘時間：<span id="time-display">100:00</span></span>
      <span>📝 進度：<span id="progress-display">0/80</span></span>
    </div>
    <form id="quiz-form" style="margin-top: 20px;">
      <div id="questions-container"></div>
      <button type="button" class="btn" onclick="submitQuiz()">提交試卷</button>
    </form>
  </div>

  <!-- 結算與複習畫面 -->
  <div id="result-screen" style="display: none;">
    <div id="result-header" class="result-header"></div>
    <button class="btn" onclick="startQuiz()">再次測驗</button>
    <h2 style="margin-top: 30px;">詳細答題檢討</h2>
    <div id="review-container"></div>
    <!-- 頁面底部新增再次測驗按鈕 -->
    <button class="btn" style="margin-top: 30px;" onclick="scrollToTopAndRestart()">再次測驗</button>
  </div>
</div>

<script>
  let allQuestions = [];
  let currentQuiz = [];
  let timerInterval = null;
  let timeRemaining = 100 * 60;

  async function loadQuestions() {
    try {
      const response = await fetch('questions.json');
      allQuestions = await response.json();

      const singleCount = allQuestions.filter(q => q.type === 'single').length;
      const multiCount = allQuestions.filter(q => q.type === 'multiple').length;
      const totalCount = allQuestions.length;

      document.getElementById('bank-info').innerHTML = `
        📚 <strong>目前匯入題庫總數：</strong> ${totalCount} 題 (純文字題)<br>
        • <strong>單選題庫：</strong> ${singleCount} 題<br>
        • <strong>複選題庫：</strong> ${multiCount} 題
      `;
    } catch (error) {
      document.getElementById('bank-info').innerHTML = `
        <span style="color:red;">❌ 無法載入題庫，請確認 questions.json 檔案是否存在！</span>
      `;
    }
  }

  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz() {
    const singles = allQuestions.filter(q => q.type === 'single');
    const multiples = allQuestions.filter(q => q.type === 'multiple');

    if (singles.length < 60 || multiples.length < 20) {
      alert(`題庫數量不足！目前單選題：${singles.length}/60，複選題：${multiples.length}/20`);
      return;
    }

    const selectedSingles = shuffle(singles).slice(0, 60);
    const selectedMultiples = shuffle(multiples).slice(0, 20);

    currentQuiz = shuffle([...selectedSingles, ...selectedMultiples]);

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderQuestions();
    startTimer();
  }

  function scrollToTopAndRestart() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    startQuiz();
  }

  function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    currentQuiz.forEach((q, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      
      const isMulti = q.type === 'multiple';
      const badgeText = isMulti ? '複選題' : '單選題';
      const badgeClass = isMulti ? 'badge-multi' : 'badge-single';
      const inputType = isMulti ? 'checkbox' : 'radio';

      let optionsHTML = '';
      q.options.forEach((opt, optIdx) => {
        const optVal = optIdx + 1;
        optionsHTML += `
          <label class="option-label">
            <input type="${inputType}" name="q_${idx}" value="${optVal}">
            ${optVal}. ${opt}
          </label>
        `;
      });

      card.innerHTML = `
        <div class="card-title">
          <span class="badge ${badgeClass}">${badgeText}</span>
          ${idx + 1}. ${q.question}
        </div>
        <div class="options-group">${optionsHTML}</div>
      `;
      container.appendChild(card);
    });

    document.getElementById('progress-display').innerText = `0/${currentQuiz.length}`;
  }

  function startTimer() {
    clearInterval(timerInterval);
    timeRemaining = 100 * 60;
    updateTimerDisplay();

    timerInterval = setInterval(() => {
      timeRemaining--;
      updateTimerDisplay();
      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        alert("考試時間到！系統將自動提交試卷。");
        submitQuiz();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const mins = Math.floor(timeRemaining / 60);
    const secs = timeRemaining % 60;
    document.getElementById('time-display').innerText = 
      `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  function submitQuiz() {
    clearInterval(timerInterval);

    let score = 0;
    const reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';

    currentQuiz.forEach((q, idx) => {
      const inputs = document.querySelectorAll(`input[name="q_${idx}"]:checked`);
      const userAnswers = Array.from(inputs).map(i => parseInt(i.value)).sort((a,b) => a-b);
      const correctAnswers = [...q.answer].sort((a,b) => a-b);

      const isCorrect = JSON.stringify(userAnswers) === JSON.stringify(correctAnswers);

      if (isCorrect) score += 1.25;

      const reviewCard = document.createElement('div');
      reviewCard.className = `card review-card ${isCorrect ? 'correct' : 'wrong'}`;
      
      const badgeText = q.type === 'multiple' ? '複選題' : '單選題';
      const badgeClass = q.type === 'multiple' ? 'badge-multi' : 'badge-single';

      let optionsReviewHTML = '';
      q.options.forEach((opt, optIdx) => {
        const optVal = optIdx + 1;
        const isUserSelected = userAnswers.includes(optVal);
        const isTarget = correctAnswers.includes(optVal);
        
        let highlightStyle = '';
        if (isTarget) highlightStyle = 'color: green; font-weight: bold;';
        if (isUserSelected && !isTarget) highlightStyle = 'color: red; text-decoration: line-through;';

        optionsReviewHTML += `
          <div style="${highlightStyle}">
            ${isUserSelected ? '▶ ' : '&nbsp;&nbsp;&nbsp;'} ${optVal}. ${opt}
          </div>
        `;
      });

      reviewCard.innerHTML = `
        <div class="card-title">
          <span class="badge ${badgeClass}">${badgeText}</span>
          ${idx + 1}. ${q.question}
        </div>
        <div style="margin-bottom: 10px;">${optionsReviewHTML}</div>
        <div class="ans-info ${isCorrect ? 'correct-bg' : 'wrong-bg'}">
          <strong>結果：</strong>${isCorrect ? '✅ 回答正確' : '❌ 回答錯誤'}<br>
          <strong>你的答案：</strong>${userAnswers.length > 0 ? userAnswers.join(', ') : '未作答'}<br>
          <strong>正確答案：</strong>${correctAnswers.join(', ')}
        </div>
      `;

      reviewContainer.appendChild(reviewCard);
    });

    const isPass = score >= 60;
    const resultHeader = document.getElementById('result-header');
    resultHeader.className = `result-header ${isPass ? 'pass' : 'fail'}`;
    resultHeader.innerHTML = `
      <h2>${isPass ? '🎉 恭喜及格！' : '❌ 未及格，請繼續努力！'}</h2>
      <p style="font-size: 24px; font-weight: bold;">本次得分：${score.toFixed(1)} 分 / 100 分</p>
    `;

    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.onload = loadQuestions;
</script>
</body>
</html>
