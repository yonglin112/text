<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建築物室內裝修工程管理乙級 - 學科模擬測驗</title>
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="裝修乙級">
  <style>
    :root {
      --primary: #2b5876;
      --secondary: #4e4376;
      --success: #28a745;
      --danger: #dc3545;
      --bg: #f4f7f6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-top: 5px;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .bank-info-box {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
    }
    .notice-tag {
      color: #d9534f;
      font-weight: bold;
      margin-top: 6px;
      display: block;
    }
    .menu-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .main-btn {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.08);
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      transition: background-color 0.2s, transform 0.1s;
    }
    .main-btn:active { transform: scale(0.99); }
    
    /* 頁面風格調和之配色 */
    .btn-red { background-color: #fbe9e7; color: #c62828; border-color: #ffccbc; }
    .btn-blue { background-color: #e3f2fd; color: #1565c0; border-color: #bbdefb; }
    .btn-orange { background-color: #fff3e0; color: #e65100; border-color: #ffe0b2; }
    .btn-white { background-color: #f5f5f5; color: #555; border-color: #e0e0e0; }
    
    .btn-sub {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 500;
      background: #ffffff;
      color: #2c3e50;
      border: 1px solid #dce4ec;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      box-sizing: border-box;
    }
    .btn-sub:hover { background: #eef5fc; }
    .sub-group {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    /* 手機介面優化之導覽列 */
    .quiz-header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
      margin-bottom: 12px;
    }
    .back-btn {
      background: #eef2f5;
      border: 1px solid #cfd8dc;
      color: #37474f;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
    }
    .back-btn:hover { background: #eceff1; }
    .quiz-title-tag {
      font-size: 15px;
      font-weight: bold;
      color: var(--primary);
      text-align: right;
      word-break: break-word;
      flex-grow: 1;
    }
    .card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      background: #fafafa;
    }
    .card-title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 3px 7px;
      font-size: 11px;
      border-radius: 4px;
      color: white;
      margin-right: 6px;
    }
    .badge-single { background-color: #007bff; }
    .badge-multi { background-color: #6f42c1; }
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-label {
      display: flex;
      align-items: center;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .option-label input { margin-right: 10px; flex-shrink: 0; }
    #timer-bar {
      position: sticky;
      top: 0;
      background: #fff;
      padding: 10px 0;
      border-bottom: 2px solid #eee;
      display: flex;
      justify-content: flex-end;
      font-weight: bold;
      font-size: 14px;
      z-index: 100;
      color: #555;
    }
    .result-header {
      text-align: center;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .pass { background-color: #d4edda; color: #155724; }
    .fail { background-color: #f8d7da; color: #721c24; }
    .review-card { border-left: 5px solid #ccc; }
    .review-card.correct { border-left-color: var(--success); }
    .review-card.wrong { border-left-color: var(--danger); }
    .ans-info {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
    }
    .ans-info.wrong-bg { background: #fff3f3; color: var(--danger); }
    .ans-info.correct-bg { background: #f3fff3; color: var(--success); }
    .stats-box {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>學科測試模擬考試</h1>

  <!-- 首頁主選單 -->
  <div id="start-screen">
    <div class="bank-info-box" id="bank-info">
      載入題庫統計中...
    </div>

    <div class="menu-group">
      <!-- 開始標準模擬測驗 -->
      <button class="main-btn btn-red" onclick="startStandardQuiz()">
        <span>開始標準模擬測驗 (80題)</span>
      </button>

      <!-- 分科/工作項目單元練習 -->
      <button class="main-btn btn-blue" onclick="toggleSubMenu()">
        <span>分科/工作項目單元練習</span>
        <span id="sub-arrow">▼</span>
      </button>

      <div class="sub-group" id="sub-menu">
        <button class="btn-sub" onclick="startSubjectQuiz('12600')">［12600建築物室內裝修工程管理］</button>
        <button class="btn-sub" onclick="startSubjectQuiz('90006')">［90006職業安全衛生共同科目］</button>
        <button class="btn-sub" onclick="startSubjectQuiz('90007')">［90007工作倫理與職業道德共同科目］</button>
        <button class="btn-sub" onclick="startSubjectQuiz('90008')">［90008環境保護共同科目］</button>
        <button class="btn-sub" onclick="startSubjectQuiz('90009')">［90009節能減碳共同科目］</button>
      </div>

      <!-- 錯題總複習 -->
      <button class="main-btn btn-orange" onclick="startWrongQuiz()">
        <span id="wrong-btn-text">錯題總複習 (目前積累 0 題)</span>
      </button>

      <!-- 重置紀錄 -->
      <button class="main-btn btn-white" onclick="resetAllRecords()">
        <span>重置刷題與錯題紀錄</span>
      </button>
    </div>

    <p style="text-align: center; font-size: 12px; color: #777; line-height: 1.6;">
      標準測驗規則：單選 60 題 (每題1分)、複選 20 題 (每題2分)，滿分 100 分，60 分及格。
    </p>
  </div>

  <!-- 測驗進行畫面 -->
  <div id="quiz-screen" style="display: none;">
    <div class="quiz-header-bar">
      <button class="back-btn" onclick="confirmReturnHome()">‹ 返回主選單</button>
      <div class="quiz-title-tag" id="current-mode-title">模擬測驗</div>
    </div>
    <div id="timer-bar">
      ⏱ 剩餘時間：<span id="time-display">100:00</span>
    </div>
    <form id="quiz-form" style="margin-top: 15px;">
      <div id="questions-container"></div>
      <button type="button" class="main-btn btn-red" style="text-align: center; justify-content: center; font-size: 17px;" onclick="submitQuiz()">提交試卷</button>
    </form>
  </div>

  <!-- 結算與複習畫面 -->
  <div id="result-screen" style="display: none;">
    <div class="quiz-header-bar">
      <button class="back-btn" onclick="returnToHome()">‹ 返回主選單</button>
      <div class="quiz-title-tag" id="result-mode-title">測驗結果檢討</div>
    </div>
    <div id="result-header" class="result-header"></div>
    <div id="analysis-box" class="stats-box"></div>
    <button class="main-btn btn-blue" style="text-align: center; justify-content: center; margin-bottom: 16px;" onclick="returnToHome()">返回主選單</button>
    <h2 style="font-size: 18px;">詳細答題檢討</h2>
    <div id="review-container"></div>
    <button class="main-btn btn-blue" style="text-align: center; justify-content: center; margin-top: 16px;" onclick="returnToHome()">返回主選單</button>
  </div>
</div>

<script>
  let allQuestions = [];
  let currentQuiz = [];
  let timerInterval = null;
  let timeRemaining = 100 * 60;
  let currentModeName = '標準模擬測驗';

  function getWrongQuestions() {
    return JSON.parse(localStorage.getItem('quiz_wrong_ids') || '[]');
  }
  function saveWrongQuestions(ids) {
    localStorage.setItem('quiz_wrong_ids', JSON.stringify([...new Set(ids)]));
  }

  async function loadQuestions() {
    try {
      const response = await fetch('questions.json');
      allQuestions = await response.json();

      const singleCount = allQuestions.filter(q => q.type === 'single').length;
      const multiCount = allQuestions.filter(q => q.type === 'multiple').length;
      const totalCount = allQuestions.length;

      document.getElementById('bank-info').innerHTML = `
        📚 <strong>目前匯入題庫總數：</strong> ${totalCount} 題<br>
        • <strong>單選題庫：</strong> ${singleCount} 題 (測驗抽 60 題，每題 1 分)<br>
        • <strong>複選題庫：</strong> ${multiCount} 題 (測驗抽 20 題，每題 2 分)<br>
        <span class="notice-tag">⚠️ 說明：本測驗已自動剔除圖說判讀等圖形題目。</span>
      `;
      updateWrongBtnText();
    } catch (error) {
      document.getElementById('bank-info').innerHTML = `
        <span style="color:red;">❌ 無法載入題庫，請確認 questions.json 檔案是否存在！</span>
      `;
    }
  }

  function updateWrongBtnText() {
    const wrongIds = getWrongQuestions();
    document.getElementById('wrong-btn-text').innerText = `錯題總複習 (目前積累 ${wrongIds.length} 題)`;
  }

  function toggleSubMenu() {
    const sub = document.getElementById('sub-menu');
    const arrow = document.getElementById('sub-arrow');
    if (sub.style.display === 'flex') {
      sub.style.display = 'none';
      arrow.innerText = '▼';
    } else {
      sub.style.display = 'flex';
      arrow.innerText = '▲';
    }
  }

  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 開始標準 80 題測驗
  function startStandardQuiz() {
    const singles = allQuestions.filter(q => q.type === 'single');
    const multiples = allQuestions.filter(q => q.type === 'multiple');

    if (singles.length < 60 || multiples.length < 20) {
      alert(`題庫數量不足！目前單選題：${singles.length}/60，複選題：${multiples.length}/20`);
      return;
    }

    const selectedSingles = shuffle(singles).slice(0, 60);
    const selectedMultiples = shuffle(multiples).slice(0, 20);
    currentQuiz = shuffle([...selectedSingles, ...selectedMultiples]);

    currentModeName = `標準模擬測驗 (共 ${currentQuiz.length} 題)`;
    launchQuiz(100 * 60);
  }

  // 開始分科/單元練習 (每次不低於 80 題)
  function startSubjectQuiz(code) {
    let filtered = [];
    const subjectNames = {
      '12600': '12600 建築物室內裝修工程管理',
      '90006': '90006 職業安全衛生',
      '90007': '90007 工作倫理與職業道德',
      '90008': '90008 環境保護',
      '90009': '90009 節能減碳'
    };

    const baseName = subjectNames[code] || '單元練習';

    if (code === '12600') {
      filtered = allQuestions.filter(q => 
        !q.question.includes('90006') && !q.question.includes('9006') &&
        !q.question.includes('90007') && !q.question.includes('9007') &&
        !q.question.includes('90008') && !q.question.includes('9008') &&
        !q.question.includes('90009') && !q.question.includes('9009') &&
        !q.question.includes('職業安全衛生') &&
        !q.question.includes('工作倫理') &&
        !q.question.includes('環境保護') &&
        !q.question.includes('節能減碳')
      );
    } else {
      filtered = allQuestions.filter(q => 
        q.question.includes(code) || 
        q.question.includes(code.slice(1)) ||
        q.question.includes(baseName.slice(6))
      );
    }

    if (filtered.length === 0) {
      alert("該科目目前無相關題目！");
      return;
    }

    // 單元練習抽考 80 題（若題庫少於 80 題則全抽）
    const targetCount = Math.min(filtered.length, 80);
    currentQuiz = shuffle(filtered).slice(0, targetCount);

    currentModeName = `${baseName} (共 ${currentQuiz.length} 題)`;
    launchQuiz(80 * 60);
  }

  // 開始錯題總複習
  function startWrongQuiz() {
    const wrongIds = getWrongQuestions();
    if (wrongIds.length === 0) {
      alert("目前沒有累積的錯題！");
      return;
    }

    currentQuiz = allQuestions.filter(q => wrongIds.includes(q.id));
    currentModeName = `錯題總複習 (共 ${currentQuiz.length} 題)`;
    launchQuiz(60 * 60);
  }

  function launchQuiz(seconds) {
    document.getElementById('current-mode-title').innerText = currentModeName;
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderQuestions();
    startTimer(seconds);
  }

  function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    currentQuiz.forEach((q, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      
      const isMulti = q.type === 'multiple';
      const badgeText = isMulti ? '複選題 (2分)' : '單選題 (1分)';
      const badgeClass = isMulti ? 'badge-multi' : 'badge-single';
      const inputType = isMulti ? 'checkbox' : 'radio';

      let optionsHTML = '';
      q.options.forEach((opt, optIdx) => {
        const optVal = optIdx + 1;
        optionsHTML += `
          <label class="option-label">
            <input type="${inputType}" name="q_${idx}" value="${optVal}">
            ${optVal}. ${opt}
          </label>
        `;
      });

      card.innerHTML = `
        <div class="card-title">
          <span class="badge ${badgeClass}">${badgeText}</span>
          ${idx + 1}. ${q.question}
        </div>
        <div class="options-group">${optionsHTML}</div>
      `;
      container.appendChild(card);
    });
  }

  function startTimer(seconds) {
    clearInterval(timerInterval);
    timeRemaining = seconds;
    updateTimerDisplay();

    timerInterval = setInterval(() => {
      timeRemaining--;
      updateTimerDisplay();
      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        alert("測驗時間到！系統自動提交試卷。");
        submitQuiz();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const mins = Math.floor(timeRemaining / 60);
    const secs = timeRemaining % 60;
    document.getElementById('time-display').innerText = 
      `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  function confirmReturnHome() {
    if (confirm("離開發佈將不會儲存本次作答紀錄，確定要返回主選單嗎？")) {
      clearInterval(timerInterval);
      returnToHome();
    }
  }

  function submitQuiz() {
    clearInterval(timerInterval);

    let score = 0;
    let singleCorrect = 0, singleTotal = 0;
    let multiCorrect = 0, multiTotal = 0;

    let wrongIds = getWrongQuestions();
    const reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';

    currentQuiz.forEach((q, idx) => {
      const inputs = document.querySelectorAll(`input[name="q_${idx}"]:checked`);
      const userAnswers = Array.from(inputs).map(i => parseInt(i.value)).sort((a,b) => a-b);
      const correctAnswers = [...q.answer].sort((a,b) => a-b);

      const isCorrect = JSON.stringify(userAnswers) === JSON.stringify(correctAnswers);
      const weight = q.type === 'multiple' ? 2 : 1;

      if (q.type === 'single') { singleTotal++; if (isCorrect) singleCorrect++; }
      if (q.type === 'multiple') { multiTotal++; if (isCorrect) multiCorrect++; }

      if (isCorrect) {
        score += weight;
        wrongIds = wrongIds.filter(id => id !== q.id);
      } else {
        wrongIds.push(q.id);
      }

      const reviewCard = document.createElement('div');
      reviewCard.className = `card review-card ${isCorrect ? 'correct' : 'wrong'}`;
      const badgeText = q.type === 'multiple' ? '複選題 (2分)' : '單選題 (1分)';
      const badgeClass = q.type === 'multiple' ? 'badge-multi' : 'badge-single';

      let optionsReviewHTML = '';
      q.options.forEach((opt, optIdx) => {
        const optVal = optIdx + 1;
        const isUserSelected = userAnswers.includes(optVal);
        const isTarget = correctAnswers.includes(optVal);
        
        let highlightStyle = '';
        if (isTarget) highlightStyle = 'color: green; font-weight: bold;';
        if (isUserSelected && !isTarget) highlightStyle = 'color: red; text-decoration: line-through;';

        optionsReviewHTML += `
          <div style="${highlightStyle}">
            ${isUserSelected ? '▶ ' : '&nbsp;&nbsp;&nbsp;'} ${optVal}. ${opt}
          </div>
        `;
      });

      reviewCard.innerHTML = `
        <div class="card-title">
          <span class="badge ${badgeClass}">${badgeText}</span>
          ${idx + 1}. ${q.question}
        </div>
        <div style="margin-bottom: 10px;">${optionsReviewHTML}</div>
        <div class="ans-info ${isCorrect ? 'correct-bg' : 'wrong-bg'}">
          <strong>結果：</strong>${isCorrect ? `✅ 回答正確 (+${weight}分)` : '❌ 回答錯誤 (+0分)'}<br>
          <strong>你的答案：</strong>${userAnswers.length > 0 ? userAnswers.join(', ') : '未作答'}<br>
          <strong>正確答案：</strong>${correctAnswers.join(', ')}
        </div>
      `;
      reviewContainer.appendChild(reviewCard);
    });

    saveWrongQuestions(wrongIds);
    updateWrongBtnText();

    document.getElementById('result-mode-title').innerText = currentModeName + ' - 檢討';
    const isPass = score >= 60;
    const resultHeader = document.getElementById('result-header');
    resultHeader.className = `result-header ${isPass ? 'pass' : 'fail'}`;
    resultHeader.innerHTML = `
      <h2 style="margin:0 0 10px 0;">${isPass ? '恭喜及格！' : '未及格，請繼續努力！'}</h2>
      <p style="font-size: 22px; font-weight: bold; margin:0;">得分：${score} 分</p>
    `;

    document.getElementById('analysis-box').innerHTML = `
      📊 <strong>本次答題弱點分析：</strong><br>
      • <strong>單選題正確率：</strong> ${singleTotal > 0 ? Math.round((singleCorrect/singleTotal)*100) : 0}% (${singleCorrect}/${singleTotal})<br>
      • <strong>複選題正確率：</strong> ${multiTotal > 0 ? Math.round((multiCorrect/multiTotal)*100) : 0}% (${multiCorrect}/${multiTotal})<br>
      💡 <em>系統已將答錯題目自動收錄至「錯題總複習」中。</em>
    `;

    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetAllRecords() {
    if (confirm("確定要清空所有答題歷史與錯題紀錄嗎？此動作無法復原。")) {
      localStorage.removeItem('quiz_wrong_ids');
      updateWrongBtnText();
      alert("紀錄已成功重置！");
    }
  }

  function returnToHome() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.onload = loadQuestions;
</script>
</body>
</html>
