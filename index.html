<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建築物室內裝修工程管理乙級 - 學科模擬測驗</title>
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="裝修乙級">
  <style>
    :root {
      --primary: #2b5876;
      --secondary: #4e4376;
      --success: #28a745;
      --danger: #dc3545;
      --warning: #ff9800;
      --bg: #f4f7f6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      box-sizing: border-box;
      position: relative;
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-top: 5px;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .bank-info-box {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
    }
    .notice-tag {
      color: #d9534f;
      font-weight: bold;
      margin-top: 6px;
      display: block;
    }
    .menu-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .main-btn {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.08);
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      transition: background-color 0.2s, transform 0.1s;
    }
    .main-btn:active { transform: scale(0.99); }
    
    .btn-red { background-color: #fbe9e7; color: #c62828; border-color: #ffccbc; }
    .btn-yellow { background-color: #fffde7; color: #f57f17; border-color: #fff9c4; }
    .btn-orange { background-color: #fff3e0; color: #e65100; border-color: #ffe0b2; }
    .btn-white { background-color: #f5f5f5; color: #555; border-color: #e0e0e0; }

    .floating-back-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 999;
      background: #ffffff;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .floating-back-btn:active { transform: scale(0.95); }

    .card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      background: #fafafa;
      position: relative;
    }
    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .card-title {
      font-weight: bold;
      font-size: 15px;
      line-height: 1.5;
      flex-grow: 1;
    }
    .star-btn {
      background: #fff;
      border: 1px solid #ffb300;
      color: #ff8f00;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
    }
    .star-btn.starred {
      background: #ffb300;
      color: #fff;
    }
    .badge {
      display: inline-block;
      padding: 3px 7px;
      font-size: 11px;
      border-radius: 4px;
      color: white;
      margin-right: 6px;
    }
    .badge-single { background-color: #007bff; }
    .badge-multi { background-color: #6f42c1; }
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-label {
      display: flex;
      align-items: center;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .option-label input { margin-right: 10px; flex-shrink: 0; }
    #timer-bar {
      position: sticky;
      top: 0;
      background: #fff;
      padding: 10px 0;
      border-bottom: 2px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 14px;
      z-index: 100;
      color: #555;
    }
    .result-header {
      text-align: center;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .pass { background-color: #d4edda; color: #155724; }
    .fail { background-color: #f8d7da; color: #721c24; }
    .review-card { border-left: 5px solid #ccc; }
    .review-card.correct { border-left-color: var(--success); }
    .review-card.wrong { border-left-color: var(--danger); }
    .ans-info {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
    }
    .ans-info.wrong-bg { background: #fff3f3; color: var(--danger); }
    .ans-info.correct-bg { background: #f3fff3; color: var(--success); }
    .stats-box {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<button class="floating-back-btn" id="floating-home-btn" style="display: none;" onclick="confirmReturnHome()">
  ‹ 返回主選單
</button>

<div class="container">
  <h1>學科測試模擬考試</h1>

  <div id="start-screen">
    <div class="bank-info-box" id="bank-info">
      載入題庫統計中...
    </div>

    <div class="menu-group">
      <button class="main-btn btn-red" onclick="startStandardQuiz()">
        <span>開始標準模擬測驗 (80題)</span>
      </button>

      <button class="main-btn btn-yellow" onclick="startStarredQuiz()">
        <span id="starred-btn-text">🟡 考題註記複習 (目前積累 0 題)</span>
      </button>

      <button class="main-btn btn-orange" onclick="startWrongQuiz()">
        <span id="wrong-btn-text">🟠 錯題總複習 (目前積累 0 題)</span>
      </button>

      <button class="main-btn btn-white" onclick="resetAllRecords()">
        <span>⚪️ 重置刷題與錯題紀錄</span>
      </button>
    </div>

    <p style="text-align: center; font-size: 12px; color: #777; line-height: 1.6;">
      標準測驗規則：單選 60 題 (每題1分)、複選 20 題 (每題2分)，滿分 100 分，60 分及格。
    </p>
  </div>

  <div id="quiz-screen" style="display: none;">
    <div id="timer-bar">
      <span id="current-mode-title" style="color: var(--primary);">模擬測驗</span>
      <span>⏱ 剩餘時間：<span id="time-display">100:00</span></span>
    </div>
    <form id="quiz-form" style="margin-top: 15px;">
      <div id="questions-container"></div>
      <button type="button" class="main-btn btn-red" style="text-align: center; justify-content: center; font-size: 17px;" onclick="submitQuiz()">提交試卷</button>
    </form>
  </div>

  <div id="result-screen" style="display: none;">
    <div id="result-header" class="result-header"></div>
    <div id="analysis-box" class="stats-box"></div>
    <button class="main-btn btn-red" style="text-align: center; justify-content: center; margin-bottom: 16px;" onclick="returnToHome()">返回主選單</button>
    <h2 style="font-size: 18px;">詳細答題檢討</h2>
    <div id="review-container"></div>
    <button class="main-btn btn-red" style="text-align: center; justify-content: center; margin-top: 16px;" onclick="returnToHome()">返回主選單</button>
  </div>
</div>

<script>
  let allQuestions = [];
  let currentQuiz = [];
  let timerInterval = null;
  let timeRemaining = 100 * 60;
  let currentModeName = '標準模擬測驗';

  function getWrongQuestions() {
    return JSON.parse(localStorage.getItem('quiz_wrong_ids') || '[]');
  }
  function saveWrongQuestions(ids) {
    localStorage.setItem('quiz_wrong_ids', JSON.stringify([...new Set(ids)]));
  }

  function getStarredQuestions() {
    return JSON.parse(localStorage.getItem('quiz_starred_ids') || '[]');
  }
  function saveStarredQuestions(ids) {
    localStorage.setItem('quiz_starred_ids', JSON.stringify([...new Set(ids)]));
  }

  function toggleStar(qId, btnElement) {
    let starred = getStarredQuestions();
    if (starred.includes(qId)) {
      starred = starred.filter(id => id !== qId);
      btnElement.classList.remove('starred');
      btnElement.innerText = '☆ 註記此題';
    } else {
      starred.push(qId);
      btnElement.classList.add('starred');
      btnElement.innerText = '★ 已註記';
    }
    saveStarredQuestions(starred);
    updateButtonsText();
  }

  function getPlayedQuestions() {
    return JSON.parse(localStorage.getItem('quiz_played_ids') || '[]');
  }
  function savePlayedQuestions(ids) {
    localStorage.setItem('quiz_played_ids', JSON.stringify([...new Set(ids)]));
  }

  async function loadQuestions() {
    try {
      // 關鍵破除快取設計：在網址帶上 timestamp
      const response = await fetch('questions.json?v=' + Date.now());
      allQuestions = await response.json();

      const singleCount = allQuestions.filter(q => q.type === 'single').length;
      const multiCount = allQuestions.filter(q => q.type === 'multiple').length;
      const totalCount = allQuestions.length;
      const playedCount = getPlayedQuestions().length;

      document.getElementById('bank-info').innerHTML = `
        📚 <strong>目前匯入題庫總數：</strong> ${totalCount} 題 (已覆蓋刷題 ${playedCount}/${totalCount} 題)<br>
        • <strong>單選題庫：</strong> ${singleCount} 題 (測驗抽 60 題，每題 1 分)<br>
        • <strong>複選題庫：</strong> ${multiCount} 題 (測驗抽 20 題，每題 2 分)<br>
        <span class="notice-tag">⚠️ 說明：本測驗已自動剔除圖說判讀等圖形題目。</span>
      `;
      updateButtonsText();
    } catch (error) {
      document.getElementById('bank-info').innerHTML = `
        <span style="color:red;">❌ 無法載入題庫，請確認 questions.json 檔案是否存在！</span>
      `;
    }
  }

  function updateButtonsText() {
    const wrongIds = getWrongQuestions();
    const starredIds = getStarredQuestions();
    document.getElementById('wrong-btn-text').innerText = `🟠 錯題總複習 (目前積累 ${wrongIds.length} 題)`;
    document.getElementById('starred-btn-text').innerText = `🟡 考題註記複習 (目前積累 ${starredIds.length} 題)`;
  }

  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function pickUniqueQuestions(pool, needCount) {
    let playedIds = getPlayedQuestions();
    let unplayed = pool.filter(q => !playedIds.includes(q.id));

    if (unplayed.length < needCount) {
      playedIds = [];
      savePlayedQuestions([]);
      unplayed = [...pool];
    }

    const shuffledPool = shuffle(unplayed);
    const selected = [];
    const selectedIds = new Set();

    for (let q of shuffledPool) {
      if (!selectedIds.has(q.id)) {
        selected.push(q);
        selectedIds.add(q.id);
      }
      if (selected.length === needCount) break;
    }

    return selected;
  }

  function startStandardQuiz() {
    const singles = allQuestions.filter(q => q.type === 'single');
    const multiples = allQuestions.filter(q => q.type === 'multiple');

    if (singles.length < 60 || multiples.length < 20) {
      alert(`題庫數量不足！目前單選題：${singles.length}/60，複選題：${multiples.length}/20`);
      return;
    }

    const selectedSingles = pickUniqueQuestions(singles, 60);
    const selectedMultiples = pickUniqueQuestions(multiples, 20);

    currentQuiz = shuffle([...selectedSingles, ...selectedMultiples]);

    let playedIds = getPlayedQuestions();
    currentQuiz.forEach(q => playedIds.push(q.id));
    savePlayedQuestions(playedIds);

    currentModeName = `標準模擬測驗 (共 ${currentQuiz.length} 題)`;
    launchQuiz(100 * 60);
  }

  function startStarredQuiz() {
    const starredIds = getStarredQuestions();
    if (starredIds.length === 0) {
      alert("目前沒有註記的考題！可在測驗中點擊「☆ 註記此題」加入收藏。");
      return;
    }

    currentQuiz = shuffle(allQuestions.filter(q => starredIds.includes(q.id)));
    currentModeName = `考題註記複習 (共 ${currentQuiz.length} 題)`;
    launchQuiz(60 * 60);
  }

  function startWrongQuiz() {
    const wrongIds = getWrongQuestions();
    if (wrongIds.length === 0) {
      alert("目前沒有累積的錯題！");
      return;
    }

    currentQuiz = shuffle(allQuestions.filter(q => wrongIds.includes(q.id)));
    currentModeName = `錯題總複習 (共 ${currentQuiz.length} 題)`;
    launchQuiz(60 * 60);
  }

  function launchQuiz(seconds) {
    document.getElementById('current-mode-title').innerText = currentModeName;
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('floating-home-btn').style.display = 'flex';

    window.scrollTo({ top: 0, behavior: 'smooth' });
    renderQuestions();
    startTimer(seconds);
  }

  function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    const starredIds = getStarredQuestions();

    currentQuiz.forEach((q, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      
      const isMulti = q.type === 'multiple';
      const badgeText = isMulti ? '複選題 (2分)' : '單選題 (1分)';
      const badgeClass = isMulti ? 'badge-multi' : 'badge-single';
      const inputType = isMulti ? 'checkbox' : 'radio';
      const isStarred = starredIds.includes(q.id);

      let optionsHTML = '';
      q.options.forEach((opt, optIdx) => {
        const optVal = optIdx + 1;
        optionsHTML += `
          <label class="option-label">
            <input type="${inputType}" name="q_${idx}" value="${optVal}">
            ${optVal}. ${opt}
          </label>
        `;
      });

      card.innerHTML = `
        <div class="card-header-bar">
          <div class="card-title">
            <span class="badge ${badgeClass}">${badgeText}</span>
            ${idx + 1}. ${q.question}
          </div>
          <button type="button" class="star-btn ${isStarred ? 'starred' : ''}" onclick="toggleStar(${q.id}, this)">
            ${isStarred ? '★ 已註記' : '☆ 註記此題'}
          </button>
        </div>
        <div class="options-group">${optionsHTML}</div>
      `;
      container.appendChild(card);
    });
  }

  function startTimer(seconds) {
    clearInterval(timerInterval);
    timeRemaining = seconds;
    updateTimerDisplay();

    timerInterval = setInterval(() => {
      timeRemaining--;
      updateTimerDisplay();
      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        alert("測驗時間到！系統自動提交試卷。");
        submitQuiz();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const mins = Math.floor(timeRemaining / 60);
    const secs = timeRemaining % 60;
    document.getElementById('time-display').innerText = 
      `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  }

  function confirmReturnHome() {
    if (confirm("離開發佈將不會儲存本次作答紀錄，確定要返回主選單嗎？")) {
      clearInterval(timerInterval);
      returnToHome();
    }
  }

  function submitQuiz() {
    clearInterval(timerInterval);

    let score = 0;
    let singleCorrect = 0, singleTotal = 0;
    let multiCorrect = 0, multiTotal = 0;

    let wrongIds = getWrongQuestions();
    const starredIds = getStarredQuestions();
    const reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';

    currentQuiz.forEach((q, idx) => {
      const inputs = document.querySelectorAll(`input[name="q_${idx}"]:checked`);
      const userAnswers = Array.from(inputs).map(i => parseInt(i.value)).sort((a,b) => a-b);
      const correctAnswers = [...q.answer].sort((a,b) => a-b);

      const isCorrect = JSON.stringify(userAnswers) === JSON.stringify(correctAnswers);
      const weight = q.type === 'multiple' ? 2 : 1;

      if (q.type === 'single') { singleTotal++; if (isCorrect) singleCorrect++; }
      if (q.type === 'multiple') { multiTotal++; if (isCorrect) multiCorrect++; }

      if (isCorrect) {
        score += weight;
        wrongIds = wrongIds.filter(id => id !== q.id);
      } else {
        wrongIds.push(q.id);
      }

      const reviewCard = document.createElement('div');
      reviewCard.className = `card review-card ${isCorrect ? 'correct' : 'wrong'}`;
      const badgeText = q.type === 'multiple' ? '複選題 (2分)' : '單選題 (1分)';
      const badgeClass = q.type === 'multiple' ? 'badge-multi' : 'badge-single';
      const isStarred = starredIds.includes(q.id);

      let optionsReviewHTML = '';
      q.options.forEach((opt, optIdx) => {
        const optVal = optIdx + 1;
        const isUserSelected = userAnswers.includes(optVal);
        const isTarget = correctAnswers.includes(optVal);
        
        let highlightStyle = '';
        if (isTarget) highlightStyle = 'color: green; font-weight: bold;';
        if (isUserSelected && !isTarget) highlightStyle = 'color: red; text-decoration: line-through;';

        optionsReviewHTML += `
          <div style="${highlightStyle}">
            ${isUserSelected ? '▶ ' : '&nbsp;&nbsp;&nbsp;'} ${optVal}. ${opt}
          </div>
        `;
      });

      reviewCard.innerHTML = `
        <div class="card-header-bar">
          <div class="card-title">
            <span class="badge ${badgeClass}">${badgeText}</span>
            ${idx + 1}. ${q.question}
          </div>
          <button type="button" class="star-btn ${isStarred ? 'starred' : ''}" onclick="toggleStar(${q.id}, this)">
            ${isStarred ? '★ 已註記' : '☆ 註記此題'}
          </button>
        </div>
        <div style="margin-bottom: 10px;">${optionsReviewHTML}</div>
        <div class="ans-info ${isCorrect ? 'correct-bg' : 'wrong-bg'}">
          <strong>結果：</strong>${isCorrect ? `✅ 回答正確 (+${weight}分)` : '❌ 回答錯誤 (+0分)'}<br>
          <strong>你的答案：</strong>${userAnswers.length > 0 ? userAnswers.join(', ') : '未作答'}<br>
          <strong>正確答案：</strong>${correctAnswers.join(', ')}
        </div>
      `;
      reviewContainer.appendChild(reviewCard);
    });

    saveWrongQuestions(wrongIds);
    updateButtonsText();

    const isPass = score >= 60;
    const resultHeader = document.getElementById('result-header');
    resultHeader.className = `result-header ${isPass ? 'pass' : 'fail'}`;
    resultHeader.innerHTML = `
      <h2 style="margin:0 0 10px 0;">${isPass ? '恭喜及格！' : '未及格，請繼續努力！'}</h2>
      <p style="font-size: 22px; font-weight: bold; margin:0;">得分：${score} 分</p>
    `;

    document.getElementById('analysis-box').innerHTML = `
      📊 <strong>本次答題弱點分析：</strong><br>
      • <strong>單選題正確率：</strong> ${singleTotal > 0 ? Math.round((singleCorrect/singleTotal)*100) : 0}% (${singleCorrect}/${singleTotal})<br>
      • <strong>複選題正確率：</strong> ${multiTotal > 0 ? Math.round((multiCorrect/multiTotal)*100) : 0}% (${multiCorrect}/${multiTotal})<br>
      💡 <em>系統已將答錯題目自動收錄至「錯題總複習」中。</em>
    `;

    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetAllRecords() {
    if (confirm("確定要清空所有答題歷史、錯題與註記紀錄嗎？此動作無法復原。")) {
      localStorage.removeItem('quiz_wrong_ids');
      localStorage.removeItem('quiz_played_ids');
      localStorage.removeItem('quiz_starred_ids');
      loadQuestions();
      alert("紀錄已成功重置！");
    }
  }

  function returnToHome() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('floating-home-btn').style.display = 'none';
    document.getElementById('start-screen').style.display = 'block';
    loadQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.onload = loadQuestions;
</script>
</body>
</html>
